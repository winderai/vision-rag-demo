[project]
name = "vision-rag-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "openai>=1.76.0",
    "pgvector-haystack>=3.2.0",
    "pillow>=11.2.1",
    "pymupdf>=1.25.5",
    "python-dotenv>=1.1.0",
]

[project.scripts]
vrag = "vrag.cli:cli"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrag"]

[dependency-groups]
dev = [
    "ruff>=0.11.7",
]
